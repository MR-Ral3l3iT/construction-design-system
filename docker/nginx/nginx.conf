user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    gzip  on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Rate limiting
    # cds-nginx อยู่หลัง nginx-gateway ทุก request จึงมาจาก IP ของ gateway
    # ถ้าไม่ตั้ง real_ip ตรงนี้ limit_req ด้านล่างจะนับรวมผู้ใช้ทุกคนเป็นคนเดียวกัน
    # แล้ว zone=auth (5 ครั้ง/นาที) จะล็อกทั้งระบบทันทีที่มีคน login ผิด 5 ครั้ง
    # เชื่อเฉพาะช่วง IP ภายในของ docker — เป็นช่วงเดียวที่ gateway ใช้ได้
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 10.0.0.0/8;
    real_ip_header   X-Forwarded-For;
    real_ip_recursive on;

    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

    include /etc/nginx/conf.d/*.conf;
}
