name: Deploy to Production

# image ไม่ได้ถูก build ที่นี่ — build บนเครื่อง dev ด้วย scripts/build-images.sh
# แล้ว upload ไฟล์ขึ้น server เอง workflow นี้แค่สั่งให้ server รัน deploy
# (โหลด image → สำรอง DB → migrate → restart → รอ healthy)
#
# ถ้าสะดวกกว่าก็ ssh เข้าไปรัน ./scripts/deploy.sh เองได้ ผลลัพธ์เหมือนกัน

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "deploy" to confirm production deployment
        required: true
      skip_load:
        description: ข้ามการโหลด image (ใช้เมื่อโหลดไว้แล้ว แค่อยาก restart)
        type: boolean
        default: false

jobs:
  deploy:
    name: SSH Deploy
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'deploy'
    environment: production

    steps:
      - name: Run deploy script on server
        uses: appleboy/ssh-action@v1
        env:
          SKIP_LOAD: ${{ github.event.inputs.skip_load }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: SKIP_LOAD
          script: |
            set -euo pipefail
            cd ${{ secrets.DEPLOY_PATH }}
            if [ "$SKIP_LOAD" = "true" ]; then
              ./scripts/deploy.sh --skip-load
            else
              ./scripts/deploy.sh
            fi
