# ─────────────────────────────────────────────────────────────────────────────
# cds-nginx — routing ภายในของแอป
#
# container นี้ "ไม่ได้" รับทราฟฟิกจากอินเทอร์เน็ตโดยตรง บน server มี
# nginx-gateway อีกชั้นที่ถือพอร์ต 80/443 ให้ทุกเว็บบนเครื่อง และเป็นคน
# terminate TLS (ใบรับรองจาก Let's Encrypt) แล้ว proxy ต่อเข้ามาที่
# พอร์ตที่ compose publish ไว้ (ค่าเริ่มต้น 8088)
#
#   Cloudflare ──► nginx-gateway :443 (TLS) ──► cds-nginx :80 ──► frontend / backend / minio
#
# ไฟล์นี้จึงรับแค่ HTTP ไม่มี ssl_certificate และไม่ redirect ไป https
# (ถ้า redirect จะวนลูปเมื่อ Cloudflare อยู่โหมด Flexible)
#
# ตัวอย่าง vhost ฝั่ง gateway ดูที่ docs/deployment.md
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name ${DOMAIN};

    # ส่งต่อ scheme ที่ผู้ใช้ใช้จริงจาก gateway — ภายใน container นี้ $scheme
    # เป็น http เสมอ ถ้าส่งค่านั้นไป แอปจะสร้างลิงก์เป็น http แล้วเบราว์เซอร์บล็อก
    set $fwd_proto $http_x_forwarded_proto;
    if ($fwd_proto = '') { set $fwd_proto $scheme; }

    client_max_body_size 60M;

    # Security headers — gateway ส่งต่อให้ผู้ใช้
    add_header X-Frame-Options        "SAMEORIGIN"    always;
    add_header X-Content-Type-Options "nosniff"       always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── API (NestJS backend) ──────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=50 nodelay;

        proxy_pass         http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $fwd_proto;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        # ออกเอกสาร PDF ใบเสนอราคา/ใบกำกับภาษี อาจใช้เวลาเกิน 60s
        proxy_read_timeout 120s;
    }

    # จำกัดแน่นกว่าปกติที่ endpoint login
    location /api/v1/auth/login {
        limit_req zone=auth burst=10 nodelay;

        proxy_pass         http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $fwd_proto;
    }

    # ── MinIO file storage ───────────────────────────────────────────────────
    location /storage/ {
        proxy_pass       http://minio:9000/;
        proxy_set_header Host      minio:9000;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Frontend (Next.js) — ที่เหลือทั้งหมด ──────────────────────────────────
    location / {
        proxy_pass         http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $fwd_proto;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }
}
